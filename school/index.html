<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MUSE-AI 본 프로그램 · 초·중·고</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body data-view="hub">
    <header class="top no-print">
      <a class="brand" href="#hub" id="to-hub">
        <span class="ticket">본</span>
        <span>
          <strong>전시물이 질문이 되는 순간</strong>
          <small>초·중·고 12차시 · 관찰 → AI → 검증</small>
        </span>
      </a>
      <nav class="main-nav">
        <a href="#hub">처음</a>
        <a href="#guide">지도안</a>
        <a href="#prompts">AI 가이드</a>
        <a href="../">이매지너리</a>
      </nav>
      <button type="button" id="teacher" class="ghost">교사</button>
    </header>

    <section id="hub" class="hub">
      <p class="hall-kicker">
        신청서의 본 프로그램입니다. 전시를 먼저 보고, AI는 그다음, 마지막에 전시로 검열합니다.
        티처블머신·Phyphox·Orange는 이 앱 밖에 있습니다. 여기는 숫자와 문장을 남기는 실험실입니다.
      </p>
      <div id="cards" class="stations"></div>
    </section>

    <section id="play" class="play" hidden>
      <div class="stage-col">
        <p id="mode-tag" class="mode-tag"></p>
        <nav id="lab-steps" class="lab-steps" aria-label="수업 단계"></nav>
        <p id="where" class="where"></p>
        <div id="lab-body" class="lab-body"></div>
      </div>
      <aside id="side" class="side"></aside>
    </section>

    <section id="sheet-view" class="paper-view" hidden>
      <div class="paper-bar no-print">
        <select id="sheet-sel"></select>
        <button type="button" id="sheet-print">인쇄 / PDF</button>
        <a id="sheet-back" class="ghost" href="#hub">보드로</a>
      </div>
      <div id="sheet-root"></div>
    </section>

    <section id="guide-view" class="paper-view" hidden>
      <div class="paper-bar no-print">
        <select id="guide-sel"></select>
        <button type="button" id="guide-print">인쇄 / PDF</button>
      </div>
      <div id="guide-root"></div>
    </section>

    <section id="prompt-view" class="paper-view" hidden>
      <div class="paper-bar no-print">
        <button type="button" id="prompt-print">인쇄 / PDF</button>
      </div>
      <div id="prompt-root"></div>
    </section>

    <footer class="foot no-print">MUSE-AI · 보드는 1차 자료 · 정답기 금지</footer>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
